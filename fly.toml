app = "bioflow-beta"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npm run db:migrate:prod"

[env]
  NODE_ENV = "production"
  BIOFLOW_RUNNER_MODE = "inline"
  BIOFLOW_SERVICE_DATA_DIR = "/data"
  BIOFLOW_DEV_ALLOW_ORG_HEADER = "false"
  BIOFLOW_ALLOWED_ORIGINS = "https://bioflow-beta.fly.dev"
  BIOFLOW_TRUST_PROXY = "true"
  BIOFLOW_METRICS_ENABLED = "true"
  BIOFLOW_CAS_MAX_OBJECT_BYTES = "16777216"
  BIOFLOW_TENANT_CAS_MAX_BYTES = "10737418240"
  BIOFLOW_CAS_MIN_FREE_BYTES = "2147483648"
  BIOFLOW_HTTP_RATE_LIMIT_POINTS = "100"
  BIOFLOW_HTTP_RATE_LIMIT_DURATION_SECONDS = "60"
  BIOFLOW_HTTP_RATE_LIMIT_BLOCK_SECONDS = "900"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

  [[http_service.checks]]
    grace_period = "45s"
    interval = "20s"
    timeout = "5s"
    method = "GET"
    path = "/readyz"

[[mounts]]
  source = "bioflow_data"
  destination = "/data"
