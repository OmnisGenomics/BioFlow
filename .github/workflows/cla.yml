name: CLA

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  CLA:
    name: CLA
    uses: OmnisGenomics/.github/.github/workflows/cla.yml@main
