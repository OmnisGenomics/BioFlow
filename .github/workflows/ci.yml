name: Nix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-ci:
    name: Nix package and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate all declared systems
        run: nix flake check --all-systems --no-build
      - name: Build package and every native check
        run: nix flake check --print-build-logs --keep-going --cores 2 --max-jobs 2
      - name: Confirm installed commands
        run: |
          nix build --print-build-logs --cores 2 --max-jobs 2
          ./result/bin/bioflow --help
