name: Publish Nix cache

# Cache publication is optional and must not block public release validation.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-cache:
    uses: OmnisGenomics/.github/.github/workflows/nix-ci.yml@main
    with:
      publish_cache: true
    secrets:
      MONARCHIC_GITHUB_PAT: ${{ secrets.MONARCHIC_GITHUB_PAT }}
